[project]
name = "proyecto-uniones"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "15aarbona", email = "alvaroarbona2003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27,<1",
    "ipykernel>=7.3.0",
    "joblib>=1.3",
    "keras>=3.15.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mcp[cli]>=1.30.0",
    "numpy>=1.24",
    "openpyxl>=3.1,<4",
    "pandas>=2.0",
    "polars>=1.44.2",
    "pyarrow>=14.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.3",
    "seaborn>=0.13.2",
    "streamlit>=1.30",
    "torch>=2.4.0",
    "tqdm>=4.66.5",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
proyecto-uniones = "proyecto_uniones:main"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
